name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to notice when a new herdr release changes the API Herdrbar reads.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Check scripts
        run: |
          bash -n Scripts/*.sh
          python3 -m py_compile Scripts/make_icons.py

  herdr:
    name: Against Homebrew herdr
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install herdr
        run: brew install herdr
      - name: End-to-end test
        run: HERDRBAR_E2E=1 swift test --filter E2ETests
